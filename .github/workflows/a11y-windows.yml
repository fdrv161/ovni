# Сборка доступной версии TELESCOPE (VST3, Windows x64) для проверки с NVDA.
# Запускается на каждый push в ветку accessible и вручную (Actions -> Run workflow).
# Результат: артефакт TELESCOPE-accessible-windows-vst3 (папка TELESCOPE.vst3 внутри ZIP).
name: A11y Windows build

on:
  push:
    branches: [accessible]
  workflow_dispatch: {}

concurrency:
  group: a11y-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: TELESCOPE VST3 (Windows x64)
    # windows-2022, а не latest: нужен генератор Visual Studio 17 2022 (так же в основном ci.yml).
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-windows-

      # Тесты и libmysofa выключены, как в основном ci.yml: TELESCOPE они не нужны для сборки плагина.
      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DOVNI_BUILD_TESTS=OFF
          -DOVNI_WITH_SOFA=OFF
          .

      - name: Build TELESCOPE VST3
        run: cmake --build build --config Release --target telescope_VST3

      - name: Find bundle
        run: |
          set -euo pipefail
          bundle=$(find build -type d -path '*telescope_artefacts/Release/VST3/*.vst3' | head -1)
          [ -n "$bundle" ] || { echo "VST3 bundle not found"; exit 1; }
          echo "VST3_BUNDLE=$bundle" >> "$GITHUB_ENV"
          # Папка, в которой лежит TELESCOPE.vst3: её и выгружаем, чтобы в ZIP была папка плагина целиком.
          echo "VST3_DIR=$(dirname "$bundle")" >> "$GITHUB_ENV"
          echo "bundle: $bundle"

      # Артефакт выгружаем до pluginval: даже если валидатор найдёт что-то, сборку можно проверить руками.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TELESCOPE-accessible-windows-vst3
          path: ${{ env.VST3_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Pluginval (strictness 10)
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          unzip -oq pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate "$VST3_BUNDLE"
